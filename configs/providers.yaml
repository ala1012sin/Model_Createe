# 기본 실행 설정 — P0는 Mock만 사용한다 (docs/CLAUDE.md 규칙 11).
# 외부/로컬 공급자로 바꾸려면 active_provider만 변경. 실제 키는 환경변수에만 둔다.
active_provider: offline_test

profiles:
  external_openai:
    kind: openai
    base_url: https://api.openai.com/v1
    model: REPLACE_WITH_AVAILABLE_MODEL
    auth_mode: bearer_env
    api_key_env: OPENAI_API_KEY
    timeout_s: 45

  local_ollama:
    kind: openai_compatible
    base_url: http://127.0.0.1:11434/v1
    model: qwen3:8b
    auth_mode: none       # 호환 SDK가 요구하는 placeholder token은 adapter 내부 처리(인증 아님)
    timeout_s: 90

  local_vllm:
    kind: openai_compatible
    base_url: http://127.0.0.1:8000/v1
    model: REPLACE_WITH_SERVED_MODEL_ID
    auth_mode: bearer_env
    api_key_env: LOCAL_LLM_API_KEY
    timeout_s: 90

  offline_test:
    kind: mock
    model: mock-recommender-v1
    auth_mode: none
    timeout_s: 5

policy:
  allow_external_data: false
  send_raw_files: false
  send_absolute_paths: false
  send_individual_sample_rows: false
  send_image_pixels: false
  max_profile_chars: 12000
  expose_tools_during_recommendation: read_only
  require_user_approval_for_training: true
