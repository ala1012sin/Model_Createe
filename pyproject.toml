[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlworkbench"
version = "0.0.1"
description = "개인용 시계열·비전 ML 워크벤치 (P0: 골격·계약)"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# 웹 화면 실행: mlwb serve (FastAPI + uvicorn)
web = ["fastapi>=0.110", "uvicorn>=0.29"]
# 개발·테스트: 웹 실행 의존성 + FastAPI 테스트 클라이언트(httpx)
dev = ["pytest>=7.4", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]
# P2 시계열 학습(CPU): 전처리·분할·평가(pandas·numpy·scikit-learn) + XGBoost.
# 확인한 조합: pandas 2.3.3/numpy 2.2.6/scikit-learn 1.7.2/xgboost 3.2.0(Python 3.10),
#             pandas 3.0.5/numpy 2.5.3/scikit-learn 1.9.1/xgboost 3.4.1(Python 3.13)
timeseries = ["pandas>=2.1", "numpy>=1.24", "scikit-learn>=1.3", "xgboost>=2.0"]
# 엑셀(.xlsx) 등록·새 데이터 적용: 저장된 수식 결과·날짜 셀 읽기(수식 실행·외부 링크 없음). 확인: openpyxl 3.1.5
xlsx = ["openpyxl>=3.1"]
# 이후 단계에서 분리: vision(torch 등)

[project.scripts]
mlwb = "mlworkbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
